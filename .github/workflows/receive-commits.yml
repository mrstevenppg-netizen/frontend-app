name: Receive Daily Commits

on:
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Total commits to make in this run'
        required: true
        default: '1'
        type: string
      scheduled_times:
        description: 'Human-readable local times for logs, e.g. "09:34,09:58"'
        required: false
        default: ''
        type: string
      commit_payload:
        description: 'JSON payload generated by the controller'
        required: true
        default: '{}'
        type: string
      target_log_file:
        description: 'Configured log file to update'
        required: false
        default: 'DEV_LOG.md'
        type: string

jobs:
  make-commits:
    name: Write ${{ github.event.inputs.commit_count }} commit(s)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name  "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Write planned maintenance commits
        run: node .github/scripts/write-commits.js
        env:
          COMMIT_COUNT:     ${{ github.event.inputs.commit_count }}
          SCHEDULED_TIMES:  ${{ github.event.inputs.scheduled_times }}
          COMMIT_PAYLOAD:   ${{ github.event.inputs.commit_payload }}
          TARGET_LOG_FILE:  ${{ github.event.inputs.target_log_file }}
          REPO_NAME:        ${{ github.repository }}
          GH_PAT:           ${{ secrets.GH_PAT }}
